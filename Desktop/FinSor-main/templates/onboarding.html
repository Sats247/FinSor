<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinSor — Risk Profiling</title>
  <meta name="description" content="Discover your investor profile in 6 quick questions.">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="onboard-page">
<nav class="onboard-nav">
  <span class="wordmark"><span class="wordmark-fin">Fin</span><span class="wordmark-sor">Sor</span></span>
</nav>
<div class="onboard-body">
  <div class="progress-wrap">
    <div class="progress-counter" id="step-counter">Step 1 of 6</div>
    <div class="progress-track-bar"><div class="progress-fill-bar" id="progress-bar" style="width:16.67%"></div></div>
  </div>

  <!-- Question Card -->
  <div class="question-card" id="question-card">
    <div id="question-content"></div>
    <div class="question-nav" id="question-nav">
      <button class="btn btn-ghost btn-sm" id="btn-back" onclick="prevStep()" style="display:none;">
        <i data-lucide="chevron-left" width="16" height="16"></i> Back
      </button>
      <div></div>
      <button class="btn btn-primary btn-sm" id="btn-next" onclick="nextStep()" disabled>
        Next <i data-lucide="arrow-right" width="16" height="16"></i>
      </button>
    </div>
  </div>

  <!-- Result Card (hidden initially) -->
  <div class="question-card result-card" id="result-card" style="display:none;">
    <div class="risk-circle" id="result-circle"></div>
    <div class="result-category" id="result-category"></div>
    <p class="result-description" id="result-description"></p>
    <div class="sub-score-row">
      <div class="sub-score-label">Risk Willingness</div>
      <div class="sub-score-track"><div class="sub-score-fill" id="sub-willingness" style="width:0%"></div></div>
    </div>
    <div class="sub-score-row">
      <div class="sub-score-label">Risk Capacity</div>
      <div class="sub-score-track"><div class="sub-score-fill" id="sub-capacity" style="width:0%"></div></div>
    </div>
    <div style="margin-top:24px;">
      <button class="btn btn-primary w-full" onclick="window.location.href='/dashboard'" style="justify-content:center;gap:8px;">
        <i data-lucide="sparkles" width="16" height="16"></i> Go to Dashboard
      </button>
    </div>
  </div>
</div>
<script src="/static/js/onboarding.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
