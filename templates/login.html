<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinSor — Sign In</title>
  <meta name="description" content="Sign in to FinSor — your AI-powered investment research terminal.">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="login-page">

  <div class="login-logo-wrap">
    <span class="wordmark" style="font-size:24px;"><span class="wordmark-fin">Fin</span><span class="wordmark-sor">Sor</span></span>
    <span class="login-subtext">Precision Ledger Terminal</span>
  </div>

  <div class="login-card">
    <h1 class="login-title">Welcome Back</h1>
    <p class="login-subtitle">Select your profile or enter your credentials.</p>

    <div class="quick-access-label">Quick Access</div>
    {% for persona in personas %}
    <button class="persona-btn" onclick="quickLogin('{{ persona.email }}')" id="persona-{{ persona.id }}">
      <div class="persona-avatar" style="background: {% if loop.index == 1 %}linear-gradient(135deg,#0058be,#2170e4){% elif loop.index == 2 %}linear-gradient(135deg,#6366f1,#0058be){% else %}linear-gradient(135deg,#0891b2,#00855b){% endif %};">
        {{ persona.name[0] }}
      </div>
      <div style="text-align:left;">
        <div class="persona-name">{{ persona.name }}</div>
        <div class="persona-tag">{{ persona.tag }}</div>
      </div>
      <i data-lucide="chevron-right" width="16" height="16" class="persona-chevron"></i>
    </button>
    {% endfor %}

    <form method="POST" action="/login" id="login-form" style="margin-top:20px;">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="input-wrapper">
          <label class="input-label">Email Address</label>
          <div class="input-with-icon">
            <i data-lucide="mail" width="16" height="16" class="input-icon-left"></i>
            <input type="email" name="email" class="input-field" id="login-email" placeholder="name@company.com" required style="padding-left:38px;">
          </div>
        </div>
        <div class="input-wrapper">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <label class="input-label" style="margin-bottom:0;">Password</label>
            <a href="#" style="font-size:var(--text-base);color:var(--primary);">Forgot Password?</a>
          </div>
          <div class="input-with-icon">
            <i data-lucide="lock" width="16" height="16" class="input-icon-left"></i>
            <input type="password" name="password" class="input-field" id="login-password" placeholder="Any password accepted for demo" style="padding-left:38px;padding-right:44px;">
            <button type="button" class="input-icon-right" onclick="toggleLoginPwd()" style="background:none;border:none;cursor:pointer;">
              <i data-lucide="eye" width="16" height="16" id="login-pwd-eye"></i>
            </button>
          </div>
        </div>
        <div class="terms-row">
          <input type="checkbox" class="custom-checkbox" id="remember-check">
          <label for="remember-check" class="terms-text">Remember this terminal</label>
        </div>
        <button type="submit" class="btn btn-primary w-full" style="justify-content:center;gap:8px;">
          Login <i data-lucide="arrow-right" width="16" height="16"></i>
        </button>
      </div>
    </form>

    <div class="divider-row"><div class="divider-line"></div><span class="divider-text">Secure Access</span><div class="divider-line"></div></div>
    <div class="social-btns">
      <button class="social-btn" onclick="alert('SSO available in FinSor Pro. (Demo only)')">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        SSO
      </button>
      <button class="social-btn" onclick="alert('Biometric login available in FinSor Pro. (Demo only)')">
        <i data-lucide="fingerprint" width="16" height="16"></i> Biometric
      </button>
    </div>
    <p class="login-bottom">Don't have an account? <a href="/">Sign up</a></p>
    <div class="login-security">
      <i data-lucide="shield" width="12" height="12"></i> AES-256 ENCRYPTED · ISO 27001 CERTIFIED
    </div>
  </div>

  <script src="/static/js/login.js"></script>
  <script>
    lucide.createIcons();
    function toggleLoginPwd() {
      const p = document.getElementById('login-password');
      const eye = document.getElementById('login-pwd-eye');
      p.type = p.type === 'password' ? 'text' : 'password';
      eye.setAttribute('data-lucide', p.type === 'password' ? 'eye' : 'eye-off');
      lucide.createIcons();
    }
    function quickLogin(email) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-form').submit();
    }
  </script>
</body>
</html>
